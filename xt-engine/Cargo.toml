[package]
name = "xt-engine"
version = "0.1.0"
edition = "2021"
authors = ["Xt-Manager Contributors"]
description = "High-performance standalone file system scanner and archive engine in Rust"

[lib]
name = "xt_engine"
crate-type = ["lib", "cdylib"]

[dependencies]
zip = "2.2"
tar = "0.4"
flate2 = "1.0"
sevenz-rust = "0.6"
bzip2 = "0.4"
lzma-rs = "0.3"
zstd = "0.13"
lz4_flex = "0.11"
cab = "0.4"
iso9660 = "0.1"
cpio = "0.2"
tempfile = "3.8"
once_cell = "1.19"
walkdir = "2.4"
jni = { version = "0.21", optional = true }

[features]
default = []
jni-support = ["dep:jni"]
